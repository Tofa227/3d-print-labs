<title>3D Print Labs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Layout: a shop window with a print-bed viewer. Hero shows one product being built layer by layer, the catalog is the body.
   Account and admin are plain, dense work views reached by hash (#account, #admin). Dark-first like the old site (#0a0a0f). */
:root{
  --bg:#0a0a0f; --surface:#12121a; --surface-2:#1a1a24; --line:#2a2a37; --fg:#ecebf1; --muted:#9a99aa;
  --accent:#ff6a1a; --accent-ink:#120a05; --good:#3ddc97; --warn:#ffc24b; --bad:#ff6b78;
  --font-display:'Unbounded','Onest',system-ui,sans-serif;
  --font-body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3f4f7; --surface:#ffffff; --surface-2:#eceef3; --line:#d6d9e2; --fg:#14141c; --muted:#5d6071;
    --accent:#d44700; --accent-ink:#ffffff; --good:#0f8a58; --warn:#8a5a00; --bad:#c42b3b; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f3f4f7; --surface:#ffffff; --surface-2:#eceef3; --line:#d6d9e2; --fg:#14141c; --muted:#5d6071;
  --accent:#d44700; --accent-ink:#ffffff; --good:#0f8a58; --warn:#8a5a00; --bad:#c42b3b; color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:15px; line-height:1.55; margin:0;
  padding-block:0; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
.wrap{max-width:1240px;margin-inline:auto}
h1,h2,h3{font-family:var(--font-display);font-weight:700;line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);
  padding:9px 14px;border-radius:6px;cursor:pointer;font-weight:500;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:18px;min-height:58px;flex-wrap:wrap;padding-block:8px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.02em}
.logo i{font-style:normal;background:var(--accent);color:var(--accent-ink);padding:3px 7px;border-radius:4px}
nav.main{display:flex;gap:4px;flex-wrap:wrap;margin-right:auto}
nav.main a{padding:6px 10px;border-radius:6px;text-decoration:none;color:var(--muted);font-size:14px}
nav.main a:hover{color:var(--fg);background:var(--surface-2)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 9px;cursor:pointer;font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.cart-btn .n{background:var(--accent);color:var(--accent-ink);border-radius:10px;min-width:20px;padding:0 6px;font-size:12px;font-family:var(--font-mono);line-height:20px;text-align:center}
#accBtn{max-width:150px;overflow:hidden;text-overflow:ellipsis}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:32px;align-items:center;padding-block:44px 0}
.hero h1{font-size:clamp(28px,4.4vw,50px);margin-top:14px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p.lead{color:var(--muted);max-width:50ch;margin-top:16px;font-size:16px}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.facts{display:grid;margin-top:26px;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-width:520px}
.facts div{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px}
.facts div:last-child{border-bottom:0}
.facts span:first-child{color:var(--muted)}
.facts span:last-child{text-align:right}
@media (max-width:900px){.hero{grid-template-columns:1fr;padding-top:28px}}

/* viewer */
.viewer{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;min-width:0}
.stage{position:relative;aspect-ratio:4/3;width:100%;max-height:560px;
  background:radial-gradient(120% 90% at 50% 100%,color-mix(in srgb,var(--accent) 14%,var(--surface-2)),var(--surface-2) 60%);touch-action:pan-y;cursor:grab}
.stage:active{cursor:grabbing}
.stage canvas{display:block;width:100%;height:100%}
.stage-top{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:flex-start;pointer-events:none}
.stage-top>*{pointer-events:auto}
.chip{font-family:var(--font-mono);font-size:12px;background:color-mix(in srgb,var(--bg) 78%,transparent);border:1px solid var(--line);border-radius:6px;padding:5px 9px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.novgl{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:24px;color:var(--muted)}
.scrub{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.scrub input[type=range]{flex:1;min-width:0}
.scrub .lay{font-family:var(--font-mono);font-size:12px;color:var(--muted);min-width:122px;text-align:right}
input[type=range]{accent-color:var(--accent)}

/* catalog */
section.sec{padding-block:72px 0}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.sec-head h2{font-size:clamp(22px,3vw,32px)}
.sec-head p{color:var(--muted);max-width:52ch}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.search{flex:1;min-width:180px;max-width:320px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:13px;font-family:var(--font-mono)}
.opt[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface-2))}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:1040px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.grid{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card .ph{aspect-ratio:4/3;background:var(--surface-2);display:block;width:100%;border:0;padding:0;cursor:pointer;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .bd{padding:12px 14px 14px;display:grid;gap:10px;flex:1;align-content:start}
.card h3{font-family:var(--font-body);font-weight:600;font-size:15px;letter-spacing:0}
.card .tagline{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card .meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card .pr{font-family:var(--font-mono);font-weight:500;color:var(--accent)}
.card .btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.dots{display:flex;gap:8px;flex-wrap:wrap}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.dot[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.empty{padding:40px 0;color:var(--muted)}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:680px;font-size:14px}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.nm{font-family:var(--font-mono);font-weight:500;white-space:nowrap}
td.r,th.r{text-align:right}
.bar{display:inline-flex;gap:3px}
.bar i{width:12px;height:6px;border-radius:2px;background:var(--line)}
.bar i.on{background:var(--accent)}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:860px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.steps{grid-template-columns:1fr}}
.step{border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--surface)}
.step .n{font-family:var(--font-mono);color:var(--accent);font-size:13px}
.step h3{font-family:var(--font-body);font-size:16px;margin:8px 0 6px}
.step p{color:var(--muted);font-size:14px}
.layers{height:46px;margin:-2px 0 14px;display:flex;flex-direction:column;justify-content:flex-end;gap:3px}
.layers i{display:block;height:3px;background:var(--line);border-radius:1px}
.faq{display:grid;gap:8px;max-width:860px}
.faq details{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 14px}
.faq summary{cursor:pointer;padding:14px 0;font-weight:500;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::after{content:"+";font-family:var(--font-mono);color:var(--accent)}
.faq details[open] summary::after{content:"–"}
.faq details p{color:var(--muted);padding-bottom:14px}
footer.ft{margin-top:84px;border-top:1px solid var(--line);padding-block:28px 40px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px}
footer.ft a{color:var(--muted)}

/* modals */
.ov{position:fixed;inset:0;z-index:80;background:rgba(5,5,10,.66);display:flex;justify-content:center;align-items:flex-start;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
#dlgOv{z-index:90}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:100%;max-width:640px;margin-block:auto;padding:18px;display:grid;gap:14px}
.modal.wide{max-width:960px}
.modal h2{font-size:20px}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{border:0;background:transparent;font-size:24px;cursor:pointer;color:var(--muted);line-height:1}
.pgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.pgrid{grid-template-columns:1fr}}
.pinfo{display:grid;gap:16px;min-width:0}
.pinfo .desc{color:var(--muted)}
.lbl{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-family:var(--font-mono)}
.kv{display:grid;gap:5px;font-size:13px}
.kv div{display:flex;justify-content:space-between;gap:10px}
.kv span:first-child{color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.row2{grid-template-columns:1fr}}
.num{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);overflow:hidden}
.num input{width:100%;min-width:0;border:0;background:transparent;text-align:center;padding:7px 4px;font-family:var(--font-mono)}
.num button{border:0;background:transparent;width:34px;height:34px;cursor:pointer;font-size:16px;color:var(--muted)}
.num button:hover{color:var(--fg)}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 4px;gap:10px;flex-wrap:wrap}
.total b{font-family:var(--font-display);font-size:clamp(22px,3vw,28px);font-weight:700;color:var(--accent)}
.small{font-size:12px;color:var(--muted)}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.line .t{font-weight:500}
.line .s{color:var(--muted);font-size:12px;font-family:var(--font-mono);grid-column:1}
.line .p{font-family:var(--font-mono);text-align:right;grid-row:1}
.line .a{grid-column:1/-1;display:flex;gap:10px;align-items:center}
.link{border:0;background:none;color:var(--muted);cursor:pointer;text-decoration:underline;font-size:12px;padding:0}
.rad{display:grid;gap:6px}
.rad label{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer;font-size:14px}
.rad label span.pp{margin-left:auto;font-family:var(--font-mono);color:var(--muted)}
.sumrow{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:2px 0}
.sumrow span:first-child{color:var(--muted)}
.form{display:grid;gap:12px}
.form label.f,label.f{display:grid;gap:5px;font-size:12px;color:var(--muted);font-family:var(--font-mono);letter-spacing:.04em;text-transform:uppercase}
.form input,.form select,.form textarea,.inp{border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:9px 10px;width:100%;min-width:0;text-transform:none;letter-spacing:0;font-family:var(--font-body);color:var(--fg);font-size:15px}
.form input[type=checkbox]{width:auto}
label.ck{display:flex;gap:8px;align-items:center;font-size:14px;text-transform:none;letter-spacing:0;font-family:var(--font-body);color:var(--fg)}
.err{color:var(--bad);font-size:12px;text-transform:none;letter-spacing:0;font-family:var(--font-body)}
.ok{color:var(--good);font-size:12px;text-transform:none;letter-spacing:0;font-family:var(--font-body)}
.phone{display:grid;grid-template-columns:auto 1fr;gap:8px}
.phone .pre{display:grid;place-items:center;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);font-family:var(--font-mono);color:var(--accent)}
pre.sum{margin:0;white-space:pre-wrap;font-family:var(--font-mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:12px;max-height:240px;overflow:auto}
.cpbox{display:grid;grid-template-columns:1fr auto;gap:8px}

/* account + admin */
.view{padding-block:36px 0}
.view h1{font-size:clamp(22px,3vw,30px)}
.vhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.st{display:inline-block;font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;padding:3px 8px;border-radius:5px;border:1px solid var(--line);white-space:nowrap}
.st.new{color:var(--accent);border-color:var(--accent)}
.st.confirmed,.st.printing{color:var(--warn);border-color:var(--warn)}
.st.ready,.st.done,.st.active{color:var(--good);border-color:var(--good)}
.st.cancelled,.st.expired,.st.used,.st.off{color:var(--bad);border-color:var(--bad)}
.ocard{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:14px 16px;display:grid;gap:12px;margin-bottom:12px}
.ocard .top2{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.stepper{display:flex;gap:0;list-style:none;margin:0;padding:0;font-size:12px}
.stepper li{flex:1;min-width:0;text-align:center;color:var(--muted);position:relative;padding-top:16px;font-family:var(--font-mono)}
.stepper li::before{content:"";position:absolute;left:0;right:0;top:5px;height:3px;background:var(--line)}
.stepper li::after{content:"";position:absolute;left:50%;top:0;width:12px;height:12px;border-radius:50%;background:var(--line);transform:translateX(-50%)}
.stepper li.on{color:var(--fg)}
.stepper li.on::before,.stepper li.on::after{background:var(--accent)}
.stepper li.cur::after{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent)}
.cplist{display:grid;gap:10px}
.coupon{border:1px dashed var(--line);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;background:var(--surface)}
.coupon b{font-family:var(--font-mono);font-size:16px;color:var(--accent)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.stat{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px 14px}
.stat small{display:block;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.stat b{font-family:var(--font-mono);font-weight:500;font-size:20px}
.rowbtns{display:flex;gap:6px;flex-wrap:wrap}
.thumb{width:48px;height:36px;border-radius:5px;background:var(--surface-2);object-fit:cover;display:block}
.hint{border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:10px 12px;font-size:13px;color:var(--muted)}

const MEM = {};
const HAS_LS = (() => { try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return true; } catch(e){ return false; } })();
const DB = {
  get(k, def){ try { const raw = HAS_LS ? localStorage.getItem('pl2_' + k) : MEM[k]; return raw ? JSON.parse(raw) : def; } catch(e){ return def; } },
  set(k, v){ const s = JSON.stringify(v); if(HAS_LS){ try { localStorage.setItem('pl2_' + k, s); return true; } catch(e){ return false; } } MEM[k] = s; return true; },
  del(k){ if(HAS_LS){ try { localStorage.removeItem('pl2_' + k); } catch(e){} } delete MEM[k]; },
  wipe(){ if(HAS_LS){ try { Object.keys(localStorage).filter(k => k.startsWith('pl2_')).forEach(k => localStorage.removeItem(k)); } catch(e){} } Object.keys(MEM).forEach(k => delete MEM[k]); }
};

async function hash(s){
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('pl:' + s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  catch(e){ return 'b64:' + btoa(unescape(encodeURIComponent('pl:' + s))); }
}
async function seed(){
  if(!DB.get('mats', null)) DB.set('mats', SEED_MATS);
  if(!DB.get('colors', null)) DB.set('colors', SEED_COLORS);
  if(DB.get('seeded', false)) return;
  DB.set('cats', SEED_CATS); DB.set('products', SEED_PRODUCTS); DB.set('delivery', SEED_DELIVERY); DB.set('coupons', SEED_COUPONS);
  DB.set('settings', SEED_SETTINGS); DB.set('users', []); DB.set('orders', []); DB.set('cart', []);
  DB.set('admin', {login:'admin', hash:await hash('admin')});
  DB.set('seeded', true);
}

function checkCoupon(list, ords, code, subtotal, user, now){
  const c = list.find(x => x.code === String(code || '').trim().toUpperCase());
  if(!c || !c.active) return {ok:false, key:'cp_invalid'};
  if(c.expires && new Date(c.expires + 'T23:59:59') < (now || new Date())) return {ok:false, key:'cp_expired_m'};
  if(c.maxUses && c.used >= c.maxUses) return {ok:false, key:'cp_limit'};
  if(subtotal < c.min) return {ok:false, key:'cp_min_m', v:c.min};
  if(c.oncePerUser){
    if(!user) return {ok:false, key:'cp_login_m'};
    if(ords.some(o => o.userId === user.id && o.coupon && o.coupon.code === c.code && o.status !== 'cancelled')) return {ok:false, key:'cp_used_m'};
  }
  const discount = c.type === 'percent' ? Math.round(subtotal * c.value / 100) : Math.min(subtotal, c.value);
  return {ok:true, c, discount};
}
function orderTotals(items, discount, fee){
  const subtotal = items.reduce((s, l) => s + l.unit * l.qty, 0);
  return {subtotal, discount, fee, total:Math.max(0, subtotal - discount) + fee};
}
function couponState(c, user, ords, now){
  if(!c || !c.active) return 'off';
  if(c.expires && new Date(c.expires + 'T23:59:59') < (now || new Date())) return 'expired';
  if(c.maxUses && c.used >= c.maxUses) return 'expired';
  if(c.oncePerUser && user && ords.some(o => o.userId === user.id && o.coupon && o.coupon.code === c.code && o.status !== 'cancelled')) return 'used';
  return 'active';
}

const DIMS = {};

/* ---------- shader + viewer ---------- */
const VERT = `varying vec3 vN; varying float vY; varying vec3 vV;
void main(){ vec4 w = modelMatrix * vec4(position,1.0); vY = w.y; vN = normalize(mat3(modelMatrix) * normal); vV = cameraPosition - w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`;
const FRAG = `uniform vec3 uColor; uniform vec3 uAccent; uniform float uClip; uniform float uStep; uniform float uActive;
varying vec3 vN; varying float vY; varying vec3 vV;
void main(){
  if(vY > uClip) discard;
  vec3 n = normalize(vN); if(!gl_FrontFacing) n = -n;
  float d = max(dot(n, normalize(vec3(0.4,0.9,0.5))),0.0)*0.75 + max(dot(n, normalize(vec3(-0.6,0.2,-0.4))),0.0)*0.25 + 0.3;
  float f = fract(vY / uStep);
  d *= mix(0.74, 1.0, smoothstep(0.0, 0.4, f));
  vec3 c = uColor * d;
  if(!gl_FrontFacing) c *= 0.5;
  c += pow(1.0 - abs(dot(n, normalize(vV))), 3.0) * 0.12;
  float edge = (1.0 - smoothstep(0.0, uStep * 1.6, uClip - vY)) * uActive;
  c = mix(c, uAccent, edge * 0.9);
  gl_FragColor = vec4(c, 1.0);
}`;
const hexVec = h => { const c = new THREE.Color(h); return new THREE.Vector3(c.r, c.g, c.b); };
const accentHex = () => getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#ff6a1a';
function mkMat(hex){
  return new THREE.ShaderMaterial({
    vertexShader:VERT, fragmentShader:FRAG, side:THREE.DoubleSide,
    uniforms:{uColor:{value:hexVec(hex)}, uAccent:{value:hexVec('#ff6a1a')}, uClip:{value:1e9}, uStep:{value:1.5}, uActive:{value:0}}
  });
}
const VIEWERS = new Set();
function viewerMarkup(top){
  return `<div class="stage"><canvas aria-label="3D"></canvas><div class="novgl">${esc(t('no_webgl'))}</div><div class="stage-top">${top || ''}</div></div>
  <div class="scrub"><button class="btn sm play"></button><input type="range" class="prog" min="0" max="1000" value="1000" aria-label="Layer"><span class="lay"></span></div>`;
}
function createViewer(host){
  const v = {ok:false, progress:1, playing:false, H:1, layers:1, auto:!matchMedia('(prefers-reduced-motion: reduce)').matches,
    theta:0.7, phi:0.95, radius:150, target:new THREE.Vector3(), mat:null, obj:null, visible:true, destroyed:false};
  const stage = host.querySelector('.stage'), cv = host.querySelector('canvas');
  const rng = host.querySelector('.prog'), play = host.querySelector('.play'), out = host.querySelector('.lay');
  v.label = () => { play.textContent = v.playing ? '❚❚ ' + t('pause') : '▶ ' + t('play'); out.textContent = Math.round(v.progress * v.layers) + ' / ' + v.layers + ' ' + t('layer'); };
  v.setProduct = v.setColor = v.refreshTheme = v.destroy = () => {};
  v.label();
  let renderer;
  try{ renderer = new THREE.WebGLRenderer({canvas:cv, antialias:true, alpha:true}); }
  catch(e){ host.querySelector('.novgl').style.display = 'grid'; rng.disabled = true; play.disabled = true; return v; }
  v.ok = true;
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(32, 4/3, 1, 3000);
  const grid = new THREE.GridHelper(200, 10, 0x888899, 0x888899); grid.material.transparent = true; grid.material.opacity = .25; scene.add(grid);
  const ro = new ResizeObserver(() => { const w = stage.clientWidth, h = stage.clientHeight; if(!w || !h) return; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); });
  ro.observe(stage);
  const io = new IntersectionObserver(es => { v.visible = es[0].isIntersecting; }); io.observe(stage);
  let drag = null;
  cv.addEventListener('pointerdown', e => { drag = {x:e.clientX, y:e.clientY}; v.auto = false; try{ cv.setPointerCapture(e.pointerId); }catch(_){} });
  cv.addEventListener('pointermove', e => { if(!drag) return; v.theta -= (e.clientX - drag.x) * 0.008; v.phi = Math.min(1.5, Math.max(0.12, v.phi - (e.clientY - drag.y) * 0.006)); drag = {x:e.clientX, y:e.clientY}; });
  const end = () => { drag = null; }; cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  const apply = () => {
    if(v.mat){

      u.uActive.value = v.progress >= 1 ? 0 : 1;
      u.uStep.value = LAYER * Math.max(1, Math.ceil(v.layers / 90));

  v.setProduct = (shape, hex) => {
    if(!BUILD[shape]) return;
    if(v.obj){ scene.remove(v.obj); v.obj.traverse(x => { if(x.geometry) x.geometry.dispose(); }); }
    if(v.mat) v.mat.dispose();

    const o = BUILD[shape](v.mat), b = new THREE.Box3().setFromObject(o), c = b.getCenter(new THREE.Vector3()), s = b.getSize(new THREE.Vector3());
    o.position.set(-c.x, -b.min.y, -c.z); scene.add(o); v.obj = o;
    v.H = s.y; v.layers = Math.max(1, Math.ceil(s.y / LAYER)); v.radius = Math.max(s.x, s.y, s.z) * 2.3 + 20; v.target.set(0, s.y / 2, 0);
    v.progress = 1; v.playing = false; rng.value = 1000; apply();
  };
  v.setColor = hex => { if(v.mat) v.mat.uniforms.uColor.value = hexVec(hex); };
  v.refreshTheme = () => { if(v.mat) v.mat.uniforms.uAccent.value = hexVec(accentHex()); };
  v.destroy = () => { v.destroyed = true; VIEWERS.delete(v); ro.disconnect(); io.disconnect(); if(v.obj) v.obj.traverse(x => { if(x.geometry) x.geometry.dispose(); }); if(v.mat) v.mat.dispose(); renderer.dispose(); if(renderer.forceContextLoss) renderer.forceContextLoss(); };
  let last = performance.now();

}
let TR = null;
function thumbRenderer(){
  if(TR !== null) return TR;
  try{ TR = new THREE.WebGLRenderer({antialias:true, alpha:true, preserveDrawingBuffer:true}); TR.setSize(480, 360, false); TR.setPixelRatio(1); }
  catch(e){ TR = false; }
  return TR;
}
const THUMBS = {};
function thumbOf(shape, color){
  const key = shape + '|' + colHex(color);
  if(THUMBS[key] !== undefined) return THUMBS[key];
  const r = thumbRenderer(); if(!r || !BUILD[shape]) return THUMBS[key] = '';
  const hex = colHex(color), mat = mkMat(hex); mat.uniforms.uAccent.value = hexVec(hex);
  const sc = new THREE.Scene(), obj = BUILD[shape](mat); sc.add(obj);
  const box = new THREE.Box3().setFromObject(obj), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  const cam = new THREE.PerspectiveCamera(30, 4/3, 1, 2000), d = Math.max(size.x, size.y, size.z) * 2.2 + 20;
  cam.position.set(c.x + d*0.62, c.y + d*0.5, c.z + d*0.7); cam.lookAt(c);
  r.setClearColor(0x000000, 0); r.render(sc, cam);
  const url = r.domElement.toDataURL('image/png');
  obj.traverse(o => { if(o.geometry) o.geometry.dispose(); }); mat.dispose();
  return THUMBS[key] = url;
}

/* hero: extruded logo that "prints" itself, independent of products */
const HERO = {raf:0, started:false};
function renderHeroChip(){}
function syncHero(){}
function startHeroAnim(){
  const host = $('#heroView'), N = 18, DEPTH = 2.4;
  let layersHtml = '';
  for(let i = 0; i < N; i++){
    const f = i / (N - 1);   // 0 back .. 1 front
    const bg = i === N - 1 ? 'var(--fg)' : `color-mix(in srgb, var(--accent) ${Math.round(45 + 55 * f)}%, #000)`;
    layersHtml += `<div class="hl-layer" style="background:${bg};transform:translateZ(${((i - N / 2) * DEPTH).toFixed(1)}px)"></div>`;
  }
  const zf = ((N / 2) * DEPTH + 1).toFixed(1);
  host.innerHTML = `<div class="stage" style="cursor:default;touch-action:auto"><div class="hlogo" role="img" aria-label="TOFA3D Studio">
      <div class="hl-scene" id="hlScene">${layersHtml}<div class="hl-hot" id="hlHot" style="transform:translateZ(${zf}px)"></div><div class="hl-noz" id="hlNoz" style="transform:translateZ(${zf}px)"></div></div></div></div>
    <div class="scrub" style="justify-content:space-between"><span class="lay" id="heroLay" style="text-align:left;min-width:0"></span><span class="lay" style="min-width:0">${LAYER.toString().replace('.', ',')} mm · PLA · 215 °C</span></div>`;
  const scene = host.querySelector('#hlScene'), hot = host.querySelector('#hlHot'), noz = host.querySelector('#hlNoz'), lay = host.querySelector('#heroLay');
  const TOTALL = 600, PRINT = 6500, HOLD = 6500, FADE = 700, TOTAL = PRINT + HOLD + FADE;
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const set = (pr, now, printing) => {
    scene.style.setProperty('--p', pr.toFixed(4));
    hot.style.opacity = noz.style.opacity = printing ? '1' : '0';
    noz.style.left = (50 + Math.sin(now / 260) * 46).toFixed(1) + '%';
    lay.textContent = `${t('layer').toUpperCase()} ${Math.round(pr * TOTALL)} / ${TOTALL}`;
  };
  const tilt = now => `rotateX(-10deg) rotateY(${(Math.sin(now / 2200) * 28).toFixed(2)}deg)`;
  if(still){ scene.style.transform = 'rotateX(-8deg) rotateY(-18deg)'; set(1, 0, false); return; }
  const t0 = performance.now();
  (function frame(now){
    HERO.raf = requestAnimationFrame(frame);
    if(document.hidden || host.hidden) return;
    const e = (now - t0) % TOTAL;
    const pr = Math.min(1, e / PRINT), q = Math.floor(pr * 90) / 90;    // stepped, like real layers
    set(e < PRINT ? q : 1, now, e < PRINT);
    scene.style.opacity = e > PRINT + HOLD ? String(Math.max(0, 1 - (e - PRINT - HOLD) / FADE)) : '1';
    scene.style.transform = tilt(now);
  })(t0);
  HERO.started = true;
}

function saveCart(){ DB.set('cart', cart.map(l => ({pid:l.pid, mat:l.mat, color:l.color, qty:l.qty}))); $('#cartN').textContent = cart.reduce((n, l) => n + l.qty, 0); }
function addLine(p, mat, color, qty){
  const ex = cart.find(l => l.pid === p.id && l.mat === mat && l.color === color);
  if(ex) ex.qty = Math.min(500, ex.qty + qty); else cart.push({pid:p.id, mat, color, qty});
  saveCart(); openCart();
}
const cartItems = () => cart.map(l => { const p = prod(l.pid); return p ? {pid:l.pid, name:p.name, shape:p.shape, mat:l.mat, color:l.color, qty:l.qty, unit:unitPrice(p, l.mat)} : null; }).filter(Boolean);
const enabledDeliveries = () => deliveries().filter(d => d.enabled);
function curDelivery(){ const list = enabledDeliveries(); return list.find(d => d.id === delivery) || list[0] || null; }
function cartCalc(){
  const items = cartItems(), sub = items.reduce((s, l) => s + l.unit * l.qty, 0), d = curDelivery(), user = curUser();
  let disc = 0, cp = null;
  if(cpCode){ const r = checkCoupon(coupons(), orders(), cpCode, sub, user); if(r.ok){ disc = r.discount; cp = r.c; } else { cpMsg = {bad:true, key:r.key, v:r.v}; cpCode = ''; } }
  return Object.assign({items, d, cp, user}, orderTotals(items, disc, d ? d.fee : 0));
}
const cpText = m => t(m.key).replace('{v}', m.v != null ? fmt(m.v) : '');
function openCart(step){ $('#cartOv').hidden = false; renderCart(step || 'cart'); }

function submitOrder(){
  const c = cartCalc(), need = c.d && c.d.type !== 'pickup';
  const name = $('#coName').value.trim(), ph = readPhone('co'), mail = $('#coMail').value.trim(), addr = need ? $('#coAddr').value.trim() : '';

  $('#ePhone').textContent = ph ? '' : t('e_phone');
  $('#eMail').textContent = mail && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail) ? t('e_email') : '';
  if(need) $('#eAddr').textContent = addr ? '' : t('e_addr');
  if($('#coForm .err:not(:empty)') || !c.items.length) return;
  const ref = 'PL-' + Date.now().toString(36).toUpperCase(), now = Date.now(), user = c.user;
  const o = {ref, ts:now, userId:user ? user.id : null, name, phone:ph, mail, tg:$('#coTg').value.trim(), note:$('#coNote').value.trim(), addr,
    delivery:{id:c.d.id, type:c.d.type, name:c.d.name, fee:c.fee}, items:c.items.map(l => ({pid:l.pid, name:l.name, mat:l.mat, color:l.color, qty:l.qty, unit:l.unit})),
    subtotal:c.subtotal, discount:c.discount, coupon:c.cp ? {code:c.cp.code, discount:c.discount} : null, total:c.total,
    status:'new', history:[{status:'new', ts:now}], inote:''};
  const all = orders(); all.push(o); DB.set('orders', all);
  if(c.cp){ const cl = coupons(); const x = cl.find(k => k.code === c.cp.code); if(x){ x.used = (x.used || 0) + 1; DB.set('coupons', cl); } }
  if(user){ const ul = users(), x = ul.find(k => k.id === user.id); if(x){ x.addr = {delivery:c.d.id, text:addr || (x.addr && x.addr.text) || ''}; DB.set('users', ul); } }

    `${t('ct_delivery')}: ${L(c.d.name)} (${fmt(c.fee)})`, ...(c.cp ? [`${t('co_disc')}: ${c.cp.code} −${fmt(c.discount)}`] : []), `${t('ct_total')}: ${fmt(c.total)}`, '',

function openAuth(mode){ authMode = mode || 'login'; openDlg(authMode === 'register' ? t('au_reg_t') : t('au_login_t'), authHTML()); }
async function submitAuth(){
  const email = $('#auEmail').value.trim().toLowerCase(), pass = $('#auPass').value;
  if(authMode === 'login'){
    const u = users().find(x => x.email === email);
    if(!u || u.passHash !== await hash(pass)) return msg('auErr', t('au_bad'));
    DB.set('session', u.id);
  } else {
    const name = $('#auName').value.trim(), ph = readPhone('au');
    if(name.length < 2) return msg('auErr', t('e_name'));
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return msg('auErr', t('e_email'));
    if(!ph) return msg('auErr', t('e_phone'));
    if(pass.length < 6) return msg('auErr', t('au_pass_min'));
    if(users().some(x => x.email === email)) return msg('auErr', t('au_exists'));
    const u = {id:uid(), name, email, phone:ph, passHash:await hash(pass), created:Date.now(), coupons:coupons().filter(k => k.grant && k.active).map(k => k.code), addr:{delivery:'', text:''}};
    const ul = users(); ul.push(u); DB.set('users', ul); DB.set('session', u.id);
  }
  closeDlg(); accLabel();
  if(!$('#cartOv').hidden) renderCart('cart');
  if(wantAcc) { wantAcc = false; go('account'); }
}

function readPhoto(file){
  return new Promise(res => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => {
      const k = Math.min(1, 640 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', 0.82)); }; img.onerror = () => res(''); img.src = fr.result; };
    fr.onerror = () => res(''); fr.readAsDataURL(file);
  });
}

/* ---------- routing ---------- */
function show(view){
  $('#viewShop').hidden = view !== 'shop'; $('#viewAccount').hidden = view !== 'account'; $('#viewAdmin').hidden = view !== 'admin';
  if(view === 'account') renderAccount(); if(view === 'admin') renderAdmin();
}
function route(){
  const h = location.hash.replace('#', ''); let view = 'shop';
  if(h === 'admin'){ if(adminOn) view = 'admin'; else openAdminLogin(); }
  else if(h === 'account'){ if(curUser()) view = 'account'; else { wantAcc = true; openAuth('login'); } }
  show(view);
  if(view === 'shop' && h && h !== 'admin' && h !== 'account'){ const el = document.getElementById(h); if(el && el.scrollIntoView) el.scrollIntoView(); }
  else if(view !== 'shop') window.scrollTo(0, 0);
}
function go(h){ if(location.hash === '#' + h) route(); else location.hash = h; }
window.addEventListener('hashchange', route);

  'acc-open':() => { if(curUser()) go('account'); else { wantAcc = true; openAuth('login'); } },
  'au-login':() => openAuth('login'), 'au-reg':() => { closeCart(); openAuth('register'); },
  'logout':() => { DB.del('session'); accLabel(); go('top'); },
  'acc-tab':el => { accTab = el.dataset.tab; renderAccount(); },
  'reorder':el => { const o = orders().find(x => x.ref === el.dataset.ref); if(!o) return; o.items.forEach(l => { const p = prod(l.pid); if(p && p.active) addLineQuiet(p, l.mat, l.color, l.qty); }); saveCart(); openCart(); },
  /* admin */
  'adm-tab':el => { adm.tab = el.dataset.tab; renderAdmin(); },
  'adm-lang':el => { alang = el.dataset.l; lsSet('pl_alang', alang); renderAdmin(); },
  'adm-logout':() => { setAdmin(false); go('top'); },
  'ord-filter':el => { adm.ordFilter = el.dataset.s; renderAdmin(); },
  'ord-open':el => ordDialog(el.dataset.ref),
  'ord-del':el => { DB.set('orders', orders().filter(o => o.ref !== el.dataset.ref)); closeDlg(); renderAdmin(); },
  'p-edit':el => productDialog(el.dataset.id),
  'p-del':el => { DB.set('products', products().filter(p => p.id !== el.dataset.id)); refreshShop(); renderAdmin(); },
  'p-photo-rm':() => { dlgPhoto = ''; $('#pfPrev').innerHTML = ''; },
  'mt-edit':el => matDialog(el.dataset.id),
  'cl-edit':el => colorDialog(el.dataset.id),
  'mt-del':el => {
    const list = mats(); if(list.length <= 1) return msg('mtMsg', a('mt_last'));
    DB.set('mats', list.filter(m => m.id !== el.dataset.id));
    const ps2 = products(); ps2.forEach(p => { if(p.mats) p.mats = p.mats.filter(x => x !== el.dataset.id); }); DB.set('products', ps2);
    refreshShop(); renderAdmin();
  },
  'cl-del':el => {
    const list = colors(); if(list.length <= 1) return msg('clMsg', a('mt_last'));
    DB.set('colors', list.filter(c => c.id !== el.dataset.id));
    const ps2 = products(); ps2.forEach(p => { if(p.colors) p.colors = p.colors.filter(x => x !== el.dataset.id); }); DB.set('products', ps2);
    refreshShop(); renderAdmin();
  },
  'c-edit':el => catDialog(el.dataset.id),
  'c-del':el => { if(products().some(p => p.cat === el.dataset.id)){ msg('catMsg', a('c_in_use')); return; } DB.set('cats', cats().filter(c => c.id !== el.dataset.id)); refreshShop(); renderAdmin(); },
  'u-orders':el => { const list = orders().filter(o => o.userId === el.dataset.id).sort((x, y) => y.ts - x.ts); const u = users().find(x => x.id === el.dataset.id); openDlg(u ? u.name : '', list.length ? `<div class="tablewrap"><table style="min-width:520px">${ordHead()}<tbody>${list.map(ordRow).join('')}</tbody></table></div>` : `<p class="empty">${a('none')}</p>`, true); },
  'u-reset':el => openDlg(a('u_reset'), `<form class="form" id="uResetForm" data-id="${esc(el.dataset.id)}"><label class="f">${a('u_newpass')}<input class="inp" id="uNewPass" type="password" autocomplete="new-password"></label><p id="uErr" class="err"></p><button class="btn primary">${a('save')}</button></form>`),
  'u-del':el => { DB.set('users', users().filter(u => u.id !== el.dataset.id)); if(DB.get('session', null) === el.dataset.id) DB.del('session'); accLabel(); renderAdmin(); },
  'k-edit':el => couponDialog(el.dataset.code),
  'k-del':el => { DB.set('coupons', coupons().filter(c => c.code !== el.dataset.code)); renderAdmin(); },
  'd-edit':el => deliveryDialog(el.dataset.id, el.dataset.type),
  'd-del':el => { const rest = deliveries().filter(d => d.id !== el.dataset.id); if(!rest.some(d => d.enabled)){ msg('dMsg', a('d_min1')); return; } DB.set('delivery', rest); renderAdmin(); },
  'reset-demo':async () => { DB.wipe(); cart = []; cpCode = ''; await seed(); PS_reset(); accLabel(); saveCart(); refreshShop(); adm.tab = 'dash'; renderAdmin(); }
};
function PS_reset(){ Object.keys(PS).forEach(k => delete PS[k]); }
function addLineQuiet(p, mat, color, qty){ const ex = cart.find(l => l.pid === p.id && l.mat === mat && l.color === color); if(ex) ex.qty = Math.min(500, ex.qty + qty); else cart.push({pid:p.id, mat, color, qty}); }
function applyCoupon(code){
  code = String(code || '').trim().toUpperCase(); if(!code){ return; }
  const c = cartCalc(), r = checkCoupon(coupons(), orders(), code, c.subtotal, c.user);
  if(r.ok){ cpCode = code; cpMsg = {bad:false, text:t('cp_applied') + ': ' + code}; } else cpMsg = {bad:true, key:r.key, v:r.v};
  renderCart('cart');
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(el && ACT[el.dataset.act]){
    if(el.dataset.sure && !el._armed){ el._armed = true; el._label = el.textContent; el.textContent = a('sure'); setTimeout(() => { el._armed = false; if(el.isConnected) el.textContent = el._label; }, 3000); return; }
    ACT[el.dataset.act](el, e); return;
  }
  if(e.target === $('#cartOv')) closeCart();
  if(e.target === $('#prodOv')) closeProduct();
  if(e.target === $('#dlgOv')) closeDlg();
});
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ if(!$('#dlgOv').hidden) closeDlg(); else if(!$('#cartOv').hidden) closeCart(); else closeProduct(); } });
const INP = {
  cc:el => { const p = el.dataset.p; $('#' + p + 'Num').placeholder = el.value === 'hu' ? '20 123 4567' : '50 123 4567'; $('#' + p + 'Num').value = ''; },
  mask:el => { el.value = mapPhone(el.value); },
  dl:el => { delivery = el.value; renderCart('cart'); },
  mqty:el => { if(M){ M.qty = Math.min(500, Math.max(1, parseInt(el.value, 10) || 1)); renderModalInfo(); } },
  ostatus:el => { setOrderStatus(el.dataset.ref, el.value); renderAdmin(); },
  photo:async el => { const f = el.files[0]; if(!f) return; const url = await readPhoto(f); if(url){ dlgPhoto = url; $('#pfPrev').innerHTML = `<img class="thumb" style="width:96px;height:72px" src="${url}" alt=""> <button type="button" class="link" data-act="p-photo-rm">${a('p_photo_rm')}</button>`; } }
};
['input', 'change'].forEach(ev => document.addEventListener(ev, e => {
  const on = e.target.dataset && e.target.dataset.on; if(!on || !INP[on]) return;
  const isText = e.target.tagName === 'INPUT' && (e.target.type === 'tel' || e.target.type === 'text');
  if(ev === 'input' && !isText) return; if(ev === 'change' && isText && on === 'mask') return;
  INP[on](e.target);
}));
const FORMS = {
  coForm:() => submitOrder(),
  auForm:() => submitAuth(),
  adLogin:async () => {
    const ad = DB.get('admin', null);
    if(ad && $('#adUser').value.trim() === ad.login && ad.hash === await hash($('#adPass').value)){ setAdmin(true); closeDlg(); go('admin'); }
    else msg('adErr', a('bad'));
  },
  cpAddForm:() => {
    const u = curUser(), code = $('#cpAddIn').value.trim().toUpperCase(); if(!u || !code) return;
    const c = coupons().find(x => x.code === code);
    if(!c || !c.active) return msg('cpAddMsg', t('cp_invalid'));
    if((u.coupons || []).includes(code)) return msg('cpAddMsg', t('cp_have'));
    const ul = users(), x = ul.find(k => k.id === u.id); x.coupons = [...(x.coupons || []), code]; DB.set('users', ul);
    renderAccount(); msg('cpAddMsg', t('cp_added'), true);
  },
  pfForm:() => {
    const u = curUser(); if(!u) return;
    const name = $('#pfName').value.trim(), email = $('#pfEmail').value.trim().toLowerCase(), ph = readPhone('pf');
    if(name.length < 2) return msg('pfMsg', t('e_name'));
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return msg('pfMsg', t('e_email'));
    if(!ph) return msg('pfMsg', t('e_phone'));
    if(users().some(x => x.email === email && x.id !== u.id)) return msg('pfMsg', t('pf_email_taken'));
    const ul = users(), x = ul.find(k => k.id === u.id); Object.assign(x, {name, email, phone:ph, addr:{delivery:$('#pfDel').value, text:$('#pfAddr').value.trim()}}); DB.set('users', ul);
    accLabel(); msg('pfMsg', t('pf_saved'), true);
  },
  pwForm:async () => {
    const u = curUser(); if(!u) return;
    if(u.passHash !== await hash($('#pwOld').value)) return msg('pwMsg', t('pf_pass_bad'));
    if($('#pwNew').value.length < 6) return msg('pwMsg', t('au_pass_min'));
    const ul = users(), x = ul.find(k => k.id === u.id); x.passHash = await hash($('#pwNew').value); DB.set('users', ul);
    $('#pwOld').value = ''; $('#pwNew').value = ''; msg('pwMsg', t('pf_pass_ok'), true);
  },
  ordForm:e => { setOrderStatus(e.target.dataset.ref, $('#ordSt').value, $('#ordNote').value.trim()); closeDlg(); renderAdmin(); },
  pForm:e => {
    const id = e.target.dataset.id, name = {}, desc = {};
    ['hu','en','ru'].forEach(l => { name[l] = $('#pfn_' + l).value.trim(); desc[l] = $('#pfd_' + l).value.trim(); });
    const fb = name.hu || name.en || name.ru; if(!fb) return msg('pfErr', a('p_name_req'));
    ['hu','en','ru'].forEach(l => { if(!name[l]) name[l] = fb; if(!desc[l]) desc[l] = desc.hu || desc.en || desc.ru || ''; });
    const price = parseInt($('#pfPrice').value, 10); if(!(price > 0)) return msg('pfErr', a('p_price_req'));
    const pm = $$('#pForm .pm:checked').map(x => x.value), pc = $$('#pForm .pc:checked').map(x => x.value);
    if(!pm.length || !pc.length) return msg('pfErr', a('p_mc_req'));
    const old = id ? prod(id) : null, data = {mats:pm, colors:pc, shape:old ? old.shape : '', cat:$('#pfCat').value, price, name, desc, active:$('#pfActive').checked, photo:dlgPhoto || ''};
    const list = products();
    if(id){ const p = list.find(x => x.id === id); if(p) Object.assign(p, data); } else list.push(Object.assign({id:'p' + uid()}, data));
    if(!DB.set('products', list)) return msg('pfErr', a('p_photo_big'));
    closeDlg(); refreshShop(); renderAdmin();
  },
  mtForm:e => {
    const old = e.target.dataset.id, id = $('#mtId').value.trim().toUpperCase().slice(0, 20), n = k => Math.max(0, parseInt($('#' + k).value, 10) || 0);
    if(!id) return msg('mtErr', a('mt_req'));
    const list = mats(); if(!old && list.some(m => m.id === id)) return msg('mtErr', a('mt_dup'));
    const use = {}; ['hu','en','ru'].forEach(l => use[l] = $('#mu_' + l).value.trim());
    const data = {id, pct:n('mt_pct'), temp:n('mt_temp'), S:Math.min(5, Math.max(1, n('mt_S'))), H:Math.min(5, Math.max(1, n('mt_H'))), F:Math.min(5, Math.max(1, n('mt_F'))), use};
    if(old){ const m = list.find(x => x.id === old); if(m) Object.assign(m, data); } else list.push(data);
    DB.set('mats', list); closeDlg(); refreshShop(); renderAdmin();
  },
  clForm:e => {
    const old = e.target.dataset.id, name = {};
    ['hu','en','ru'].forEach(l => name[l] = $('#cn2_' + l).value.trim());
    const fb = name.hu || name.en || name.ru; if(!fb) return msg('clErr', a('mt_req'));
    ['hu','en','ru'].forEach(l => { if(!name[l]) name[l] = fb; });
    const list = colors(), hex = $('#clHex').value;
    if(old){ const c = list.find(x => x.id === old); if(c) Object.assign(c, {name, hex}); } else list.push({id:'c' + uid(), name, hex});
    DB.set('colors', list); closeDlg(); refreshShop(); renderAdmin();
  },
  catForm:e => {
    const id = e.target.dataset.id, name = {};
    ['hu','en','ru'].forEach(l => name[l] = $('#cn_' + l).value.trim());
    const fb = name.hu || name.en || name.ru; if(!fb) return msg('cErr', a('p_name_req'));
    ['hu','en','ru'].forEach(l => { if(!name[l]) name[l] = fb; });
    const list = cats();
    if(id){ const c = list.find(x => x.id === id); if(c) c.name = name; } else list.push({id:'c' + uid(), name});
    DB.set('cats', list); closeDlg(); refreshShop(); renderAdmin();
  },
  uResetForm:async e => {
    const pw = $('#uNewPass').value; if(pw.length < 6) return msg('uErr', a('u_pass_min'));
    const ul = users(), u = ul.find(x => x.id === e.target.dataset.id); if(u){ u.passHash = await hash(pw); DB.set('users', ul); }
    closeDlg();
  },
  kForm:e => {
    const old = e.target.dataset.code, code = $('#kCode').value.trim().toUpperCase(), value = parseInt($('#kVal').value, 10);
    if(!code || !(value > 0)) return msg('kErr', a('k_bad'));
    const list = coupons();
    if(!old && list.some(c => c.code === code)) return msg('kErr', a('k_dup'));
    const data = {code, type:$('#kType').value, value, min:parseInt($('#kMin').value, 10) || 0, expires:$('#kExp').value || '', maxUses:parseInt($('#kMax').value, 10) || 0,
      oncePerUser:$('#kOnce').checked, grant:$('#kGrant').checked, active:$('#kActive').checked};
    if(old){ const c = list.find(x => x.code === old); if(c) Object.assign(c, data); } else list.push(Object.assign({used:0}, data));
    DB.set('coupons', list); closeDlg(); renderAdmin();
  },
  dForm:e => {
    const id = e.target.dataset.id, name = {};
    ['hu','en','ru'].forEach(l => name[l] = $('#dn_' + l).value.trim());
    const fb = name.hu || name.en || name.ru; if(!fb) return msg('dErr', a('p_name_req'));
    ['hu','en','ru'].forEach(l => { if(!name[l]) name[l] = fb; });
    const list = deliveries(), fee = Math.max(0, parseInt($('#dFee').value, 10) || 0), enabled = $('#dOn').checked;
    if(id){ const d = list.find(x => x.id === id); if(d) Object.assign(d, {name, fee, enabled}); } else list.push({id:'d' + uid(), type:e.target.dataset.type, name, fee, enabled});
    if(!list.some(d => d.enabled)) return msg('dErr', a('d_min1'));
    DB.set('delivery', list); closeDlg(); renderAdmin(); if(!$('#cartOv').hidden) renderCart('cart');
  },
  leadForm:() => {
    const mn = Math.max(0, parseInt($('#leadMin').value, 10) || 0), mx = Math.max(mn, parseInt($('#leadMax').value, 10) || 0);
    DB.set('settings', Object.assign(settings(), {leadMin:mn, leadMax:mx})); renderStatic(); msg('leadMsg', a('saved'), true);
  },
  credForm:async () => {
    const login = $('#crLogin').value.trim(), pass = $('#crPass').value;
    if(login.length < 3 || pass.length < 6) return msg('crMsg', a('st_cred_bad'));
    DB.set('admin', {login, hash:await hash(pass)}); $('#crPass').value = ''; msg('crMsg', a('saved'), true);
  }
};
document.addEventListener('submit', e => { e.preventDefault(); const f = FORMS[e.target.id]; if(f) f(e); });

/* ---------- language / theme / boot ---------- */
function applyLang(){
  document.documentElement.lang = lang;
  $$('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  $$('[data-i18n-html]').forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  $$('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  $$('#langSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  renderChips(); renderCatalog(); renderMaterials(); renderStatic(); renderHeroChip(); accLabel();
  $$('.novgl').forEach(n => n.textContent = t('no_webgl'));
  VIEWERS.forEach(v => v.label());
  if(M) renderModalInfo();
  if(!$('#cartOv').hidden) renderCart('cart');
  if(!$('#viewAccount').hidden) renderAccount();
}
function applyTheme(th){
  if(th) document.documentElement.setAttribute('data-theme', th); else document.documentElement.removeAttribute('data-theme');
  requestAnimationFrame(() => VIEWERS.forEach(v => v.refreshTheme()));
}
$('#themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  const next = cur === 'dark' ? 'light' : 'dark'; lsSet('pl_theme', next); applyTheme(next);
});
$('#langSeg').addEventListener('click', e => { const b = e.target.closest('[data-lang]'); if(!b) return; lang = b.dataset.lang; lsSet('pl_lang', lang); applyLang(); });
$('#cartBtn').addEventListener('click', () => openCart());

(async function boot(){
  const th = lsGet('pl_theme'); if(th === 'light' || th === 'dark') applyTheme(th);
  await seed();
  cart = DB.get('cart', []); cart = Array.isArray(cart) ? cart.filter(l => l && prod(l.pid)) : [];
  saveCart(); applyLang();
  startHeroAnim();
  route();
})();
</script>
